name: Mirror to Forgejo

on:
  push:
    branches:
      - main
    tags:
      - "**"
  pull_request:
    branches:
      - main
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

jobs:
  mirror-git:
    name: Mirror branches, tags, history and signatures
    runs-on: ubuntu-latest
    steps:
      - name: Bare-mirror clone the source repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --mirror "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" source.git

      - name: Ensure Forgejo repo exists
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            "https://git.erik-skopp.de/api/v1/repos/eskopp/${FORGEJO_REPO}")
          if [ "$status" = "404" ]; then
            echo "Creating Forgejo repo ${FORGEJO_REPO}"
            curl -s -X POST -H "Authorization: token ${FORGEJO_TOKEN}" -H "Content-Type: application/json" \
              -d "$(jq -n --arg name "$FORGEJO_REPO" '{name: $name, private: true, auto_init: false}')" \
              "https://git.erik-skopp.de/api/v1/user/repos" > /dev/null
          fi

      - name: Push mirror to Forgejo
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          cd source.git
          # A bare --mirror clone of a GitHub repo also picks up refs/pull/*/head
          # (GitHub advertises those for read), which Forgejo rejects on push as
          # "deny updating a hidden ref". Push only heads and tags explicitly
          # (with --prune so deleted branches/tags are removed on Forgejo too).
          # GPG commit/tag signatures are part of the git objects themselves and
          # travel along automatically.
          git push --prune "https://eskopp:${FORGEJO_TOKEN}@git.erik-skopp.de/eskopp/${FORGEJO_REPO}.git" \
            'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'

  sync-releases:
    name: Mirror GitHub Releases to Forgejo Releases
    runs-on: ubuntu-latest
    needs: mirror-git
    if: github.event_name != 'release' || github.event.action != 'deleted'
    steps:
      - name: Sync releases via API
        env:
          GH_TOKEN: ${{ github.token }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_OWNER: eskopp
          FORGEJO_REPO: ${{ github.event.repository.name }}
          GH_REPO_FULL: ${{ github.repository }}
        run: |
          set -euo pipefail

          releases=$(curl -s -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/${GH_REPO_FULL}/releases?per_page=100")

          echo "$releases" | jq -c '.[]' | while read -r release; do
            tag=$(echo "$release" | jq -r '.tag_name')
            name=$(echo "$release" | jq -r '.name // .tag_name')
            body=$(echo "$release" | jq -r '.body // ""')
            prerelease=$(echo "$release" | jq -r '.prerelease')
            draft=$(echo "$release" | jq -r '.draft')

            existing=$(curl -s -H "Authorization: token ${FORGEJO_TOKEN}" \
              "https://git.erik-skopp.de/api/v1/repos/${FORGEJO_OWNER}/${FORGEJO_REPO}/releases/tags/${tag}")
            release_id=$(echo "$existing" | jq -r '.id // empty')

            payload=$(jq -n --arg tag "$tag" --arg name "$name" --arg body "$body" \
              --argjson prerelease "$prerelease" --argjson draft "$draft" \
              '{tag_name: $tag, name: $name, body: $body, prerelease: $prerelease, draft: $draft}')

            if [ -n "$release_id" ]; then
              echo "Updating Forgejo release for $tag"
              curl -s -X PATCH -H "Authorization: token ${FORGEJO_TOKEN}" -H "Content-Type: application/json" \
                -d "$payload" \
                "https://git.erik-skopp.de/api/v1/repos/${FORGEJO_OWNER}/${FORGEJO_REPO}/releases/${release_id}" > /dev/null
            else
              echo "Creating Forgejo release for $tag"
              created=$(curl -s -X POST -H "Authorization: token ${FORGEJO_TOKEN}" -H "Content-Type: application/json" \
                -d "$payload" \
                "https://git.erik-skopp.de/api/v1/repos/${FORGEJO_OWNER}/${FORGEJO_REPO}/releases")
              release_id=$(echo "$created" | jq -r '.id')
            fi

            # Forgejo has no "external link" assets like GitLab - download from
            # GitHub and re-upload the actual binary.
            echo "$release" | jq -c '.assets[]?' | while read -r asset; do
              asset_name=$(echo "$asset" | jq -r '.name')
              asset_api_url=$(echo "$asset" | jq -r '.url')
              curl -sL -H "Authorization: token ${GH_TOKEN}" -H "Accept: application/octet-stream" \
                -o "/tmp/${asset_name}" "$asset_api_url"
              curl -s -X POST -H "Authorization: token ${FORGEJO_TOKEN}" \
                -F "attachment=@/tmp/${asset_name}" \
                "https://git.erik-skopp.de/api/v1/repos/${FORGEJO_OWNER}/${FORGEJO_REPO}/releases/${release_id}/assets?name=${asset_name}" > /dev/null
              rm -f "/tmp/${asset_name}"
            done
          done

  delete-release:
    name: Delete Forgejo Release
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'deleted'
    steps:
      - name: Delete matching Forgejo release
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_OWNER: eskopp
          FORGEJO_REPO: ${{ github.event.repository.name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          existing=$(curl -s -H "Authorization: token ${FORGEJO_TOKEN}" \
            "https://git.erik-skopp.de/api/v1/repos/${FORGEJO_OWNER}/${FORGEJO_REPO}/releases/tags/${TAG}")
          release_id=$(echo "$existing" | jq -r '.id // empty')
          if [ -n "$release_id" ]; then
            curl -s -X DELETE -H "Authorization: token ${FORGEJO_TOKEN}" \
              "https://git.erik-skopp.de/api/v1/repos/${FORGEJO_OWNER}/${FORGEJO_REPO}/releases/${release_id}" > /dev/null
          fi
